# This repo's own project. It builds and tests each piece alone, with the
# headermap off and no prefix header, so an import outside a piece's declared
# dependencies fails here even when an app's headermap would resolve it.
# Generated by XcodeGen (`make project`) and not checked in.

name: vibe-libs

include:
  - path: vibe-libs.yml

options:
  bundleIdPrefix: com.commonwealthrecordings.vibelibs
  deploymentTarget:
    macOS: "13.0"
    iOS: "26.0"

settings:
  base:
    VIBE_LIBS_ROOT: "$(SRCROOT)"
    USE_HEADERMAP: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    GCC_PREFIX_HEADER: ""
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_C_LANGUAGE_STANDARD: c17
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CODE_SIGNING_ALLOWED: NO

# Each piece has a macOS test bundle over Tests/<piece> and a <piece>-iOS
# static library, both listing its template. A macOS-only piece, marked in the
# plan's map, has the test bundle alone: no <piece>-iOS target, and no iOS
# target lists its template, directly or through another template. An
# iOS-only piece is the mirror: an iOS target alone, and no macOS target lists
# its template.
targets:
  # core/Common, tested on macOS. Verbose logging and the signposts are on, as
  # in Vibe's Debug builds, so the stall sampler and the work tally compile and
  # run. The hang bounds match Vibe's.
  CommonTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsCommon]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/core/Common
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Tests/Support"]
        GCC_PREPROCESSOR_DEFINITIONS: &common-definitions
          - "$(inherited)"
          - "VIBE_VERBOSE_LOGGING=1"
          - "VIBE_SIGNPOSTS=1"
          - "VIBE_TEST_HANG_TIMEOUT=10"
          - "VIBE_TEST_GATE_TIMEOUT=30"

  # core/Common built for iOS, with its probe of the header-only files.
  Common-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsCommon]
    templateAttributes:
      excludedPlatform: Mac
    sources:
      - path: Tests/core/Common/CommonProbe.m
    settings:
      base:
        GCC_PREPROCESSOR_DEFINITIONS: *common-definitions

  # core/Graphics, tested on macOS. Its tests are the Mac half's.
  GraphicsTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsGraphics]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/core/Graphics
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # core/Graphics built for iOS: its shared files and its iOS half.
  Graphics-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsGraphics]
    templateAttributes:
      excludedPlatform: Mac

  # audio/AudioTypes, tested on macOS.
  AudioTypesTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsAudioTypes]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/audio/AudioTypes
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # audio/AudioTypes built for iOS, with its probe of the header-only files.
  AudioTypes-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsAudioTypes]
    templateAttributes:
      excludedPlatform: Mac
    sources:
      - path: Tests/audio/AudioTypes/AudioTypesProbe.m

  # audio/DSP, tested on macOS. The tests' hang bound matches Vibe's.
  DSPTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsDSP]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/audio/DSP
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "VIBE_TEST_HANG_TIMEOUT=10"]

  # audio/DSP built for iOS, so an AppKit leak fails here.
  DSP-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsDSP]
    templateAttributes:
      excludedPlatform: Mac

  # audio/Analysis, tested on macOS: the framer, and both analyzers over
  # synthesized clicks and chords.
  AnalysisTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsAnalysis]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/audio/Analysis
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # audio/Analysis built for iOS. Key analysis is an app's choice per
  # platform, so the piece builds on both.
  Analysis-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsAnalysis]
    templateAttributes:
      excludedPlatform: Mac

  # audio/OutputDevices, tested on macOS. The bundle compiles the Mac half. The
  # iOS half's rules are header-only and Foundation-only, so their tests run
  # here too. Verbose logging is on, as in Vibe's tests, so the HAL event log
  # compiles and its listener is tested. The hang and gate bounds match Vibe's.
  OutputDevicesTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsOutputDevices]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/audio/OutputDevices
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "VIBE_VERBOSE_LOGGING=1"
          - "VIBE_TEST_HANG_TIMEOUT=10"
          - "VIBE_TEST_GATE_TIMEOUT=30"

  # audio/OutputDevices built for iOS: its iOS half, the audio session.
  OutputDevices-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsOutputDevices]
    templateAttributes:
      excludedPlatform: Mac

  # audio/FX, tested on macOS. The chain's render tests run in PlayerTests,
  # since they run over the player's manual render pump.
  FXTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsFX]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/audio/FX
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # audio/FX built for iOS, with its probe of the seam, which only tests import.
  FX-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsFX]
    templateAttributes:
      excludedPlatform: Mac
    sources:
      - path: Tests/audio/FX/FXProbe.m

  # audio/Meter, tested on macOS. Verbose logging is on, as in Vibe's tests,
  # so the meter's signal probe compiles here. The iOS build compiles it off.
  MeterTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsMeter]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/audio/Meter
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "VIBE_VERBOSE_LOGGING=1"]

  # audio/Meter built for iOS, with its probe of the render seam, which only
  # tests import.
  Meter-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsMeter]
    templateAttributes:
      excludedPlatform: Mac
    sources:
      - path: Tests/audio/Meter/MeterProbe.m

  # files/FileLoading, tested on macOS. The tests drive the seams and the fake
  # cloud, which compile only under DEBUG, so the bundle defines it in every
  # configuration, the analyzer's Release build included. The coordinator's
  # tests take their provider operations and served handle from Tests/Support.
  # Verbose logging is on, as in Vibe's tests. The hang and gate bounds match
  # Vibe's.
  FileLoadingTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsFileLoading]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/files/FileLoading
        excludes: ["**/*.md"]
      - path: Tests/Support/MaterializationTestFakes.m
      - path: Tests/Support/VibeTestServedFile.m
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Tests/Support"]
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "DEBUG=1"
          - "VIBE_VERBOSE_LOGGING=1"
          - "VIBE_TEST_HANG_TIMEOUT=10"
          - "VIBE_TEST_GATE_TIMEOUT=30"

  # files/FileLoading built for iOS, so an AppKit leak fails here.
  FileLoading-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsFileLoading]
    templateAttributes:
      excludedPlatform: Mac

  # files/DiskCache, tested on macOS, over stores in a temporary directory.
  DiskCacheTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsDiskCache]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/files/DiskCache
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "VIBE_TEST_HANG_TIMEOUT=10"]

  # files/DiskCache built for iOS.
  DiskCache-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsDiskCache]
    templateAttributes:
      excludedPlatform: Mac

  # files/HTTP, tested on macOS, over HTTPStub. HTTPStub scripts the answers
  # of this piece's fake, which compiles only under DEBUG. So the bundle
  # defines it in every configuration, the analyzer's Release build
  # included. The hang and gate bounds match Vibe's.
  HTTPTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsHTTP]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/files/HTTP
        excludes: ["**/*.md"]
      - path: Tests/Support/HTTPStub.m
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Tests/Support"]
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "DEBUG=1"
          - "VIBE_VERBOSE_LOGGING=1"
          - "VIBE_TEST_HANG_TIMEOUT=10"
          - "VIBE_TEST_GATE_TIMEOUT=30"

  # files/HTTP built for iOS.
  HTTP-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsHTTP]
    templateAttributes:
      excludedPlatform: Mac

  # files/RemoteFiles, tested on macOS, over HTTPStub and a temporary root,
  # as HTTPTests are. The tests drive FileLoading's remote backend.
  RemoteFilesTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsRemoteFiles]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/files/RemoteFiles
        excludes: ["**/*.md"]
      - path: Tests/Support/HTTPStub.m
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Tests/Support"]
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "DEBUG=1"
          - "VIBE_VERBOSE_LOGGING=1"
          - "VIBE_TEST_HANG_TIMEOUT=10"
          - "VIBE_TEST_GATE_TIMEOUT=30"

  # files/RemoteFiles built for iOS.
  RemoteFiles-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsRemoteFiles]
    templateAttributes:
      excludedPlatform: Mac

  # files/ShareLinks, tested on macOS: the link rules, the fake web server's
  # answers and faults, and an iCloud Drive lookup through the link client.
  # The fake compiles only under DEBUG, so the bundle defines it in every
  # configuration.
  ShareLinksTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsShareLinks]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/files/ShareLinks
        excludes: ["**/*.md"]
      - path: Tests/Support/HTTPStub.m
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Tests/Support"]
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "DEBUG=1"
          - "VIBE_VERBOSE_LOGGING=1"
          - "VIBE_TEST_HANG_TIMEOUT=10"
          - "VIBE_TEST_GATE_TIMEOUT=30"

  # files/ShareLinks built for iOS, where an app opens links too.
  ShareLinks-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsShareLinks]
    templateAttributes:
      excludedPlatform: Mac

  # audio/Decode, tested on macOS. The tests drive the read-ahead's seam and
  # the coordinator's test seams, which compile only under DEBUG, so the
  # bundle defines it in every configuration, the analyzer's Release build
  # included. The file fixtures and the read-ahead script come from
  # Tests/Support. The fuzz tests also read the fixtures an app generates,
  # when VIBE_AUDIO_FIXTURES names their folder. Verbose logging is on, as in
  # Vibe's tests. The hang and gate bounds match Vibe's.
  DecodeTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsDecode]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/audio/Decode
        excludes: ["**/*.md"]
      - path: Tests/Support/VibeReadAheadScript.m
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Tests/Support"]
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "DEBUG=1"
          - "VIBE_VERBOSE_LOGGING=1"
          - "VIBE_TEST_HANG_TIMEOUT=10"
          - "VIBE_TEST_GATE_TIMEOUT=30"

  # audio/Decode built for iOS, so an AppKit leak fails here, with its probe
  # of the tail window math, which only tests import.
  Decode-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsDecode]
    templateAttributes:
      excludedPlatform: Mac
    sources:
      - path: Tests/audio/Decode/DecodeProbe.m

  # audio/Player, tested on macOS. The tests drive the player's seam, the
  # manual render pump, and the coordinator's test seams, which compile only
  # under DEBUG, so the bundle defines it in every configuration, the
  # analyzer's Release build included. The render suite in Render/ plays an
  # app's generated fixtures, so it is not compiled here. An app's test target
  # compiles it over them (AGENTS.md, Tests). The test track and the reference
  # fixtures come from Tests/Support. Verbose logging is on, as in Vibe's tests.
  # The hang and gate bounds match Vibe's.
  PlayerTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsPlayer]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/audio/Player
        excludes: ["**/*.md", "Render/**"]
      - path: Tests/Support/VibeTestTrack.m
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Tests/Support"]
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "DEBUG=1"
          - "VIBE_VERBOSE_LOGGING=1"
          - "VIBE_TEST_HANG_TIMEOUT=10"
          - "VIBE_TEST_GATE_TIMEOUT=30"

  # audio/Player built for iOS: its shared files and its iOS half.
  Player-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsPlayer]
    templateAttributes:
      excludedPlatform: Mac

  # media/Tags, tested on macOS. The tests write their own files through
  # AVFoundation. They are Objective-C++, whose framework imports link
  # nothing on their own, so the bundle links AVFoundation.
  TagsTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsTags]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/media/Tags
        excludes: ["**/*.md"]
    dependencies:
      - sdk: AVFoundation.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # media/Tags built for iOS, so an AppKit leak fails here.
  Tags-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsTags]
    templateAttributes:
      excludedPlatform: Mac

  # media/Metadata, tested on macOS. The loader tests drive the loader's seam
  # and the file loader's, which compile only under DEBUG, so the bundle defines
  # it in every configuration, the analyzer's Release build included. The tag
  # and fuzz tests write their own files through TagLib's writers, the file
  # handle, and AVFoundation, which the bundle links. Ogg's audio comes from an
  # app's generated fixtures, when VIBE_AUDIO_FIXTURES names their folder, and
  # those cases skip without them. The fixtures come from Tests/Support.
  # Verbose logging is on, as in Vibe's tests. The hang and gate bounds match
  # Vibe's.
  MetadataTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsMetadata]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/media/Metadata
        excludes: ["**/*.md"]
    dependencies:
      - sdk: AVFoundation.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Tests/Support"]
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "DEBUG=1"
          - "VIBE_VERBOSE_LOGGING=1"
          - "VIBE_TEST_HANG_TIMEOUT=10"
          - "VIBE_TEST_GATE_TIMEOUT=30"

  # media/Metadata built for iOS, so an AppKit leak fails here.
  Metadata-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsMetadata]
    templateAttributes:
      excludedPlatform: Mac

  # media/PlayQueue, tested on macOS, over rows of the tests' own.
  PlayQueueTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsPlayQueue]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/media/PlayQueue
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # media/PlayQueue built for iOS.
  PlayQueue-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsPlayQueue]
    templateAttributes:
      excludedPlatform: Mac

  # media/Playlists, tested on macOS, over temporary folders. The
  # embedded-sheet and fuzz tests take their FLAC writers and their generator
  # from Tests/Support.
  PlaylistsTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsPlaylists]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/media/Playlists
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Tests/Support"]

  # media/Playlists built for iOS.
  Playlists-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsPlaylists]
    templateAttributes:
      excludedPlatform: Mac

  # media/FolderScan, tested on macOS, over temporary folders. The
  # embedded-sheet tests take their FLAC writers from Tests/Support. DEBUG is
  # on in every configuration, so the dataless test can set FileLoading's
  # probe.
  FolderScanTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsFolderScan]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/media/FolderScan
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Tests/Support"]
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "DEBUG=1", "VIBE_TEST_HANG_TIMEOUT=10"]

  # media/FolderScan built for iOS.
  FolderScan-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsFolderScan]
    templateAttributes:
      excludedPlatform: Mac

  # waveform/Waveform, tested on macOS: the summary's builder, reads, deep
  # zoom, and archive, the raster's steps and coverage, the mono mix, and the
  # cache entry.
  WaveformTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsWaveform]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/waveform/Waveform
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # waveform/Waveform built for iOS, where an app's scrubber draws with it.
  Waveform-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsWaveform]
    templateAttributes:
      excludedPlatform: Mac

  # waveform/WaveformLoading, tested on macOS. The tests drive the loader's
  # and the cache's seams, the read-ahead's seam, and the coordinator's test
  # seams, which compile only under DEBUG, so the bundle defines it in every
  # configuration, the analyzer's Release build included. They write their
  # own files. The test track, the file fixtures, and the read-ahead script
  # come from Tests/Support. Verbose logging is on, as in Vibe's tests. The
  # hang and gate bounds match Vibe's.
  WaveformLoadingTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsWaveformLoading]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/waveform/WaveformLoading
        excludes: ["**/*.md"]
      - path: Tests/Support/VibeTestTrack.m
      - path: Tests/Support/VibeReadAheadScript.m
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Tests/Support"]
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "DEBUG=1"
          - "VIBE_VERBOSE_LOGGING=1"
          - "VIBE_TEST_HANG_TIMEOUT=10"
          - "VIBE_TEST_GATE_TIMEOUT=30"

  # waveform/WaveformLoading built for iOS, where an app's scrubber loads
  # waveforms through it.
  WaveformLoading-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsWaveformLoading]
    templateAttributes:
      excludedPlatform: Mac

  # waveform/WaveformStyles, tested on macOS: every style drawn into a layer
  # with no window, the morph engine, the registry, the theme's palettes, and
  # the level and zoom math. The renderer tests build waveforms bin by bin
  # through Tests/Support.
  WaveformStylesTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsWaveformStyles]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/waveform/WaveformStyles
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Tests/Support"]
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "VIBE_VERBOSE_LOGGING=1", "VIBE_SIGNPOSTS=1"]

  # waveform/WaveformStyles built for iOS, where an app's scrubber draws with it.
  WaveformStyles-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsWaveformStyles]
    templateAttributes:
      excludedPlatform: Mac

  # waveform/WaveformView, tested on macOS: the mac view drawn into a bitmap
  # through the shared drawn-view support, over waveforms built bin by bin.
  # The signposts compile, as in WaveformStyles' tests.
  WaveformViewTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsWaveformView]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/waveform/WaveformView
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Tests/Support"]
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "VIBE_VERBOSE_LOGGING=1", "VIBE_SIGNPOSTS=1"]

  # waveform/WaveformView built for iOS: the shared header and the scrubber.
  WaveformView-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsWaveformView]
    templateAttributes:
      excludedPlatform: Mac

  # ui/Controls, tested on macOS. Its tests draw through the shared drawn-view
  # support in Tests/Support.
  ControlsTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsControls]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/ui/Controls
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Tests/Support"]

  # ui/Controls built for iOS: its shared files, the indicators, with a probe
  # of the equalizer's seam, which only tests import.
  Controls-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsControls]
    templateAttributes:
      excludedPlatform: Mac
    sources:
      - path: Tests/ui/Controls/ControlsProbe.m

  # ui/SettingsWindow, tested on macOS. It is macOS only, so it has no iOS
  # target. Its tests share the drawn-view support with Controls'.
  SettingsWindowTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsSettingsWindow]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/ui/SettingsWindow
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Tests/Support"]

  # ui/Shortcuts, tested on macOS. It is macOS only, so it has no iOS target.
  ShortcutsTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsShortcuts]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/ui/Shortcuts
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # files/SandboxAccess, tested on macOS. It is macOS only, so it has no iOS
  # target. Its tests store grants in a defaults suite of their own.
  SandboxAccessTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsSandboxAccess]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/files/SandboxAccess
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "VIBE_TEST_HANG_TIMEOUT=10"
          - "VIBE_TEST_GATE_TIMEOUT=30"

  # system/NowPlaying, tested on macOS through its publication path, with an
  # injected clock and sinks in place of the system's centers.
  NowPlayingTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsNowPlaying]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/system/NowPlaying
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # system/NowPlaying built for iOS.
  NowPlaying-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsNowPlaying]
    templateAttributes:
      excludedPlatform: Mac

  # system/Updates, tested on macOS. It is macOS only, so it has no iOS target.
  # Its tests make the updater unstarted, so no feed is read.
  UpdatesTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsUpdates]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/system/Updates
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # dev/DebugChannel, tested on macOS. Its sources compile only under DEBUG,
  # so the bundle defines it in every configuration, the analyzer's Release
  # build included. The hang bound matches Vibe's.
  DebugChannelTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsDebugChannel]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/dev/DebugChannel
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "DEBUG=1", "VIBE_TEST_HANG_TIMEOUT=10"]

  # dev/DebugChannel built for iOS, with DEBUG in every configuration, so the
  # tmp directory's watcher compiles too.
  DebugChannel-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsDebugChannel]
    templateAttributes:
      excludedPlatform: Mac
    settings:
      base:
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "DEBUG=1"]

  # dev/iOSDriver, which is iOS only. Its build is this UI-testing bundle,
  # with no host app: the driver drives an app by bundle identifier, so an
  # app's bundle names its own app. Nothing runs it here, since it waits for
  # commands until told to quit.
  iOSDriver:
    type: bundle.ui-testing
    platform: iOS
    templates: [VibeLibsIOSDriver]
    templateAttributes:
      excludedPlatform: Mac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

  # system/AppOpening, tested on macOS with injected schedulers, so no test
  # waits on the clock. It is macOS only, so it has no iOS target.
  AppOpeningTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsAppOpening]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: Tests/system/AppOpening
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  # third_party/: each library's tests build it alone and call into it once,
  # so a missing file or a broken link fails here. Each iOS target builds the
  # library for the simulator. None of them excludes a platform half.
  TaglibTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsTaglib]
    sources:
      - path: Tests/third_party/taglib
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  Taglib-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsTaglib]

  PINCacheTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsPINCache]
    sources:
      - path: Tests/third_party/PINCache
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  PINCache-iOS:
    type: library.static
    platform: iOS
    templates: [VibeLibsPINCache]

  PINOperationTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsPINOperation]
    sources:
      - path: Tests/third_party/PINOperation
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  PINOperation-iOS:
    type: library.static
