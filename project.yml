  OggTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsOgg]
    sources:
      - path: Tests/third_party/ogg
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  Ogg-iOS:
    type: library.static
    platform: iOS
