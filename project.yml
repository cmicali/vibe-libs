  VorbisTests:
    type: bundle.unit-test
    platform: macOS
    templates: [VibeLibsVorbis]
    sources:
      - path: Tests/third_party/vorbis
        excludes: ["**/*.md"]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  Vorbis-iOS:
