# A minimal app of its own, outside this repo's project. It includes the
# shared spec from another directory, as an app's submodule does, and builds
# with no prefix header and no headermap. `make consumer` builds and runs it.

name: Consumer

include:
  - path: ../../vibe-libs.yml

options:
  deploymentTarget:
    macOS: "13.0"

settings:
  base:
    VIBE_LIBS_ROOT: "$(SRCROOT)/../.."
    USE_HEADERMAP: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    GCC_PREFIX_HEADER: ""
    CLANG_ENABLE_OBJC_ARC: YES
    # As Vibe and this repo's project build. Under a GNU dialect, Graphics'
    # constant-sized arrays warn as a GNU extension, and warnings are errors.
    GCC_C_LANGUAGE_STANDARD: c17
    # TagLib and Waveform are C++17, and XcodeGen's default is gnu++14. Vibe
    # and this repo's project build C++17 too.
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    CODE_SIGNING_ALLOWED: NO
    # As an app's Debug build defines it. The player plays here through its
    # manual render pump, which a build without DEBUG compiles out.
    GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "DEBUG=1"]
    # As an app's Debug build keeps them. The equalizer's debug count reads
    # its result only in an assertion, so with DEBUG and no assertions it is
    # an unused variable, and warnings are errors.
    ENABLE_NS_ASSERTIONS: YES

targets:
  Consumer:
    type: tool
    platform: macOS
    # VibeLibsTags and VibeLibsMetadata after VibeLibsDecode, which lists
    # libvorbis: see the TRAP beside VibeLibsTags.
    templates: [VibeLibsAudioTypes, VibeLibsDSP, VibeLibsAnalysis, VibeLibsOutputDevices, VibeLibsFX,
                VibeLibsMeter, VibeLibsFileLoading, VibeLibsDecode, VibeLibsPlayer, VibeLibsTags, VibeLibsMetadata,
                VibeLibsWaveform, VibeLibsWaveformLoading, VibeLibsWaveformStyles, VibeLibsDiskCache, VibeLibsGraphics,
                VibeLibsPlayQueue, VibeLibsPlaylists, VibeLibsFolderScan, VibeLibsControls, VibeLibsSettingsWindow,
                VibeLibsShortcuts, VibeLibsNowPlaying, VibeLibsWaveformView, VibeLibsHTTP, VibeLibsShareLinks,
                VibeLibsDebugChannel, VibeLibsDebugVerbs, VibeLibsSandboxAccess, VibeLibsAppOpening]
    templateAttributes:
      excludedPlatform: iOS
    sources:
      - path: main.m
      - path: ConsumerTrack.m
      - path: FileLoading.m
      - path: Player.m
      - path: Tags.mm
      - path: Metadata.mm
      - path: Waveform.mm
      - path: WaveformStyles.mm
      - path: NowPlaying.m
      - path: WaveformView.mm
      - path: ShareLinks.m
      - path: DebugChannel.m
      - path: SandboxAccess.m
      - path: AppOpening.m
    scheme: {}
