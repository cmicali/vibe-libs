# The shared spec. An app includes it, sets VIBE_LIBS_ROOT to where this repo sits,
# and lists the pieces it wants under `templates:`, with
# `templateAttributes: {excludedPlatform: iOS}` on macOS or `Mac` on iOS.
# Paths here resolve relative to this file. A template lists the templates of
# the pieces it depends on, so an app names only the pieces it uses.
# Each template's header search paths are its own piece's, so a build with
# the headermap off reaches only the pieces a piece declares.
#
# TRAP: an app sets a target's own HEADER_SEARCH_PATHS in that target's
# `settings: base:`, never only through a settings group. A template's paths
# join a target's base setting, but they replace a group's, which silently
# drops the app's own paths from that target.

targetTemplates:
  # generate-git-info.sh is not compiled. An app that wants build provenance's
  # git fields runs it in a pre-build phase and searches what it writes.
  VibeLibsCommon:
    sources:
      - path: core/Common
        excludes: ["**/*.md", "**/*.sh", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/core/Common"]

  # Each half's headers are searched on both platforms. The excluded half's
  # sources do not compile, so only a stray import could reach its headers.
  VibeLibsGraphics:
    sources:
      - path: core/Graphics
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(VIBE_LIBS_ROOT)/core/Graphics"
          - "$(VIBE_LIBS_ROOT)/core/Graphics/Mac"
          - "$(VIBE_LIBS_ROOT)/core/Graphics/iOS"

  # The words every audio piece shares. Nothing here logs, so it lists no
  # template, not even Common's.
  VibeLibsAudioTypes:
    sources:
      - path: audio/AudioTypes
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/audio/AudioTypes"]

  # It lists r8brain for the resampler.
  VibeLibsDSP:
    templates: [VibeLibsCommon, VibeLibsR8brain]
    sources:
      - path: audio/DSP
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/audio/DSP"]

  # Tempo and musical key from mono PCM. It lists AudioTypes for the key.
  # Nothing here logs, so it lists no Common.
  #
  # TRAP: it links Accelerate itself. Its sources are all Objective-C++,
  # which Xcode builds with -fno-cxx-modules, so their framework imports
  # link nothing on their own. It passes a linker flag, not an sdk
  # dependency, since XcodeGen refuses a target that lists the same sdk
  # twice, and an app may list Accelerate too.
  VibeLibsAnalysis:
    templates: [VibeLibsAudioTypes]
    sources:
      - path: audio/Analysis
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/audio/Analysis"]
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Accelerate"]

  # Mac/ is the HAL's output devices, and iOS/ the audio session. Each half's
  # headers are searched on both platforms, as Graphics' are. It lists
  # Common for the log macros and the retry scheduler's type.
  VibeLibsOutputDevices:
    templates: [VibeLibsCommon]
    sources:
      - path: audio/OutputDevices
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(VIBE_LIBS_ROOT)/audio/OutputDevices/Mac"
          - "$(VIBE_LIBS_ROOT)/audio/OutputDevices/iOS"

  # The DJ chain over Apple's audio units. It lists DSP for the stereo buffer
  # list and the fade steps its gates take. Its seam compiles in every
  # configuration. AudioFX.m wraps the body in #if DEBUG, so a release build
  # ships none of it.
  VibeLibsFX:
    templates: [VibeLibsCommon, VibeLibsDSP]
    sources:
      - path: audio/FX
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/audio/FX"]

  # Live band levels from inside a render. Its band math is its own, so it
  # lists no DSP. Its seams compile in every configuration. Each body is
  # wrapped in #if DEBUG, so a release build ships none of it.
  VibeLibsMeter:
    templates: [VibeLibsCommon]
    sources:
      - path: audio/Meter
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/audio/Meter"]

  # Claim/ decides which open runs, and Transfer/ moves the bytes. Each
  # directory is searched, since the files name each other's headers alone.
  # The seams and the fake cloud compile in every configuration. Each wraps
  # its body in #if DEBUG, so a release build ships none of it. It lists
  # AudioTypes for the extensions whose tags read by range.
  VibeLibsFileLoading:
    templates: [VibeLibsCommon, VibeLibsAudioTypes]
    sources:
      - path: files/FileLoading
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(VIBE_LIBS_ROOT)/files/FileLoading"
          - "$(VIBE_LIBS_ROOT)/files/FileLoading/Claim"
          - "$(VIBE_LIBS_ROOT)/files/FileLoading/Transfer"

  VibeLibsDiskCache:
    templates: [VibeLibsCommon, VibeLibsPINCache]
    sources:
      - path: files/DiskCache
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/files/DiskCache"]

  # Ranged HTTP transfers: a download streamed into a file, a ranged read,
  # and a probe of the first bytes. Foundation only. The fake of ranged
  # serving compiles in every configuration. It wraps its body in #if DEBUG,
  # so a release build ships none of it.
  VibeLibsHTTP:
    templates: [VibeLibsCommon]
    sources:
      - path: files/HTTP
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/files/HTTP"]

  # A file on a server kept as a local placeholder, fetched over HTTP, and
  # served as FileLoading's remote backend. It lists Decode for the tail
  # window math.
  #
  # TRAP: an app that also takes VibeLibsTaglib lists this template first, as
  # it would VibeLibsDecode, which this one lists.
  VibeLibsRemoteFiles:
    templates: [VibeLibsCommon, VibeLibsFileLoading, VibeLibsHTTP, VibeLibsDecode]
    sources:
      - path: files/RemoteFiles
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/files/RemoteFiles"]

  # Share links turned into the address of their bytes, the rules for any web
  # link, and the client that looks up an iCloud Drive share first. The fake
  # web server compiles in every configuration. It wraps its body in #if
  # DEBUG, so a release build ships none of it.
  VibeLibsShareLinks:
    templates: [VibeLibsCommon, VibeLibsHTTP]
    sources:
      - path: files/ShareLinks
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/files/ShareLinks"]

  # The audio file handle and the decoders it hosts. It lists FileLoading for
  # a stream's and a read-ahead's bytes. The read-ahead's seam compiles in
  # every configuration and wraps its body in #if DEBUG, so a release build
  # ships none of it.
  #
  # TRAP: an app that also takes VibeLibsTaglib lists this template first, as
  # it would VibeLibsVorbis. The handle includes libvorbis's vorbisfile.h.
  VibeLibsDecode:
    templates: [VibeLibsCommon, VibeLibsFileLoading, VibeLibsDrMp3, VibeLibsDrFlac, VibeLibsDrWav, VibeLibsVorbis]
    sources:
      - path: audio/Decode
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/audio/Decode"]

  # The transport, the voice bus, the master bus, and the output unit. Mac/
  # binds a device and drives bit-perfect output, and iOS/ follows the route.
  # Each half's headers are searched on both platforms, as OutputDevices' are.
  # The seam and the manual render pump compile in every configuration. Each
  # wraps its body in #if DEBUG, so a release build ships none of it.
  #
  # TRAP: an app that also takes VibeLibsTaglib lists this template first, as
  # it would VibeLibsDecode, which this one lists.
  VibeLibsPlayer:
    templates: [VibeLibsCommon, VibeLibsAudioTypes, VibeLibsDSP, VibeLibsDecode, VibeLibsFX, VibeLibsMeter,
                VibeLibsOutputDevices, VibeLibsFileLoading]
    sources:
      - path: audio/Player
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(VIBE_LIBS_ROOT)/audio/Player"
          - "$(VIBE_LIBS_ROOT)/audio/Player/Mac"
          - "$(VIBE_LIBS_ROOT)/audio/Player/iOS"

  # TagLib's fields and embedded art bytes. It lists AudioTypes for the
  # format names and Common for the log macros. Its one source is
  # Objective-C++, which Xcode builds with -fno-cxx-modules, so its import of
  # Foundation links nothing on its own. It passes a linker flag, as Analysis
  # does for Accelerate. It brings TagLib, whose sources are C++17, so an app
  # builds C++ as C++17 or later.
  #
  # TRAP: an app that also takes VibeLibsVorbis or VibeLibsDecode lists this
  # template after them, as it would VibeLibsTaglib. taglib/ogg holds TagLib's
  # own vorbis/vorbisfile.h, and the first search path wins.
  VibeLibsTags:
    templates: [VibeLibsCommon, VibeLibsAudioTypes, VibeLibsTaglib]
    sources:
      - path: media/Tags
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/media/Tags"]
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Foundation"]

  # The tag record and its CoreAudio fallback, the cache, the background scan,
  # embedded art and thumbnails, and covers beside the files. Artwork/ and
  # Artwork/FolderArt/ are searched, since the files name each other's headers
  # alone. It lists AudioTypes for the playable item and the format names,
  # Decode for the fallback's handle, Tags for the TagLib parse, DiskCache for
  # the store, FileLoading for the materialization and the ranged read,
  # Graphics for the image helpers, and TagLib and PINCache, whose own headers
  # the parse and the cache read. Its seams compile in every configuration.
  # Each wraps its body in #if DEBUG, so a release build ships none of it.
  #
  # Its Objective-C++ sources include TagLib's headers, so an app builds C++
  # as C++17 or later. Xcode builds them with -fno-cxx-modules, so their
  # framework imports link nothing on their own. It passes linker flags for
  # Foundation and the parse's AudioToolbox, as Tags does.
  #
  # TRAP: an app that also takes VibeLibsVorbis or VibeLibsDecode lists this
  # template after them, as it would VibeLibsTags.
  VibeLibsMetadata:
    templates: [VibeLibsCommon, VibeLibsAudioTypes, VibeLibsDecode, VibeLibsTags, VibeLibsDiskCache,
                VibeLibsFileLoading, VibeLibsGraphics, VibeLibsTaglib, VibeLibsPINCache]
    sources:
      - path: media/Metadata
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(VIBE_LIBS_ROOT)/media/Metadata"
          - "$(VIBE_LIBS_ROOT)/media/Metadata/Artwork"
          - "$(VIBE_LIBS_ROOT)/media/Metadata/Artwork/FolderArt"
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Foundation", "-framework", "AudioToolbox"]

  # The play queue over an app's own entries. It reads an entry only through
  # the key blocks the app passes, so it lists no template. Nothing here logs.
  VibeLibsPlayQueue:
    sources:
      - path: media/PlayQueue
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/media/PlayQueue"]

  # CUE sheets, also embedded in FLAC, and M3U, read and written as records.
  # It lists AudioTypes for the playable extensions and the CD frame rate,
  # and Common for the path spelling. Nothing here logs.
  VibeLibsPlaylists:
    templates: [VibeLibsCommon, VibeLibsAudioTypes]
    sources:
      - path: media/Playlists
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/media/Playlists"]

  # The folder walk: a file, a folder, or a playlist file into entries, with
  # CUE sheets beside the files and inside a large FLAC. It lists AudioTypes
  # for the playable extensions, FileLoading for the placeholder checks,
  # Playlists for the readers and the entry record, and Common for the
  # emptiness test and the log macros.
  VibeLibsFolderScan:
    templates: [VibeLibsCommon, VibeLibsAudioTypes, VibeLibsFileLoading, VibeLibsPlaylists]
    sources:
      - path: media/FolderScan
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/media/FolderScan"]

  # The waveform engine, in C++17, so an app builds C++ as C++17 or later.
  # Beside it, in Objective-C++, AudioWaveform.mm names the summary for an
  # app and archives it as a cache entry. It lists Common for that file's log.
  # The C++ summary and band split are a decode's work per sample, and its
  # raster every picture's. So they are optimized in every configuration, as
  # the decoders are, and a Debug build loads and draws as a shipped one does.
  # -O3, because -Os vectorizes none of its loops. Measured in Vibe, it cut a
  # cache read's CPU by a third and 3-Band's load frames by a quarter, for
  # 16 KB of code. Every picture stayed byte for byte the same. The cache
  # entry takes the target's own flags, as it did in Vibe.
  #
  # TRAP: it links Accelerate and libcompression itself. Its sources are all
  # C++ or Objective-C++, which Xcode builds with -fno-cxx-modules, so their
  # framework imports link nothing on their own. It passes linker flags, not
  # sdk dependencies, since XcodeGen refuses a target that lists the same sdk
  # twice, and an app may list Accelerate too.
  VibeLibsWaveform:
    templates: [VibeLibsCommon]
    sources:
      - path: waveform/Waveform
        excludes: ["**/*.md", "${excludedPlatform}/**", "**/*.mm"]
        compilerFlags: ["-O3"]
      - path: waveform/Waveform
        includes: ["**/*.mm"]
        excludes: ["${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/waveform/Waveform"]
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Accelerate", "-lcompression"]

  # A file decoded into a waveform summary, with observers on the same pass,
  # cached on disk and shared between requests. It opens files through
  # Decode's handle and FileLoading's materializer, reads the CUE window math
  # and the playable-item protocol from AudioTypes, and files entries through
  # DiskCache and PINCache. Its seams compile in every configuration. Each
  # wraps its body in #if DEBUG, so a release build ships none of it.
  #
  # TRAP: an app that also takes VibeLibsTaglib lists this template first, as
  # it would VibeLibsDecode, which this one lists.
  VibeLibsWaveformLoading:
    templates: [VibeLibsCommon, VibeLibsWaveform, VibeLibsAudioTypes, VibeLibsDecode, VibeLibsDiskCache,
                VibeLibsFileLoading, VibeLibsPINCache]
    sources:
      - path: waveform/WaveformLoading
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/waveform/WaveformLoading"]

  # Each style's look: its columns, levels, colors, zoom math, and the morph
  # engine that eases between them. It lists Waveform for the summary it
  # draws, Graphics for the platform colors, and Common for the log,
  # signpost, and helper macros.
  #
  # TRAP: it links Foundation, QuartzCore, and CoreGraphics itself. Its
  # renderers are Objective-C++, which Xcode builds with -fno-cxx-modules, so
  # their framework imports link nothing on their own. It passes linker
  # flags, as Analysis does for Accelerate. AppKit or UIKit is linked by the
  # import in WaveformTheme.m, which is Objective-C.
  VibeLibsWaveformStyles:
    templates: [VibeLibsCommon, VibeLibsWaveform, VibeLibsGraphics]
    sources:
      - path: waveform/WaveformStyles
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/waveform/WaveformStyles"]
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "Foundation", "-framework", "QuartzCore",
                        "-framework", "CoreGraphics"]

  # The views that host a renderer: Mac/ the mac's NSView, and iOS/ the
  # scrubber. The accessibility contract they share sits between the halves.
  # It lists WaveformStyles for the renderers and the theme, Waveform for the
  # summary, Controls for the loading indicator, Graphics for the appearance
  # helpers, and Common for the signpost and tally macros. Each half's headers
  # are searched on both platforms, as Graphics' are.
  #
  # TRAP: it links QuartzCore, and AppKit or UIKit, itself. Its sources are
  # all Objective-C++, which Xcode builds with -fno-cxx-modules, so their
  # framework imports link nothing on their own. The platform's framework is
  # a setting of its own, conditional on the SDK. A conditional OTHER_LDFLAGS
  # would replace the flags every other template passes.
  VibeLibsWaveformView:
    templates: [VibeLibsCommon, VibeLibsWaveformStyles, VibeLibsWaveform, VibeLibsControls, VibeLibsGraphics]
    sources:
      - path: waveform/WaveformView
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(VIBE_LIBS_ROOT)/waveform/WaveformView"
          - "$(VIBE_LIBS_ROOT)/waveform/WaveformView/Mac"
          - "$(VIBE_LIBS_ROOT)/waveform/WaveformView/iOS"
        "VIBE_LIBS_WAVEFORM_VIEW_UI_FRAMEWORK[sdk=macosx*]": AppKit
        "VIBE_LIBS_WAVEFORM_VIEW_UI_FRAMEWORK[sdk=iphone*]": UIKit
        OTHER_LDFLAGS: ["$(inherited)", "-framework", "QuartzCore", "-framework",
                        "$(VIBE_LIBS_WAVEFORM_VIEW_UI_FRAMEWORK)"]

  # The loading and equalizer indicators are shared files, which both
  # platforms draw. Mac/ holds the mac's drawn controls, so an iOS target
  # compiles only the shared files. The Mac/ half's headers are searched on
  # both platforms, as Graphics' are. It lists Common for the weak proxy and
  # the helper macros.
  VibeLibsControls:
    templates: [VibeLibsGraphics, VibeLibsCommon]
    sources:
      - path: ui/Controls
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/ui/Controls", "$(VIBE_LIBS_ROOT)/ui/Controls/Mac"]

  # macOS only, so no iOS target may list it. Its files sit in its Mac/ half,
  # as Controls' do. It lists Common for NSString+FormLabel, the colon rule
  # its rows share with an app's iOS screens.
  VibeLibsSettingsWindow:
    templates: [VibeLibsControls, VibeLibsCommon]
    sources:
      - path: ui/SettingsWindow
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/ui/SettingsWindow/Mac"]

  # macOS only, so no iOS target may list it. Its files sit in its Mac/ half,
  # as SettingsWindow's do. The layout's lookup links Carbon, which an
  # import of <Carbon/Carbon.h> brings in by itself.
  VibeLibsShortcuts:
    templates: [VibeLibsSettingsWindow]
    sources:
      - path: ui/Shortcuts
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/ui/Shortcuts/Mac"]

  # Security-scoped bookmarks and folder grants, with the grant panel. macOS
  # only, so no iOS target may list it. Its files sit in its Mac/ half, as
  # Shortcuts' do. It lists Common for the path spelling and the log and
  # main-thread macros. Its AppKit import links the framework.
  VibeLibsSandboxAccess:
    templates: [VibeLibsCommon]
    sources:
      - path: files/SandboxAccess
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/files/SandboxAccess/Mac"]

  # Now Playing info and remote commands, over MediaPlayer. It lists Graphics
  # for the image alias and the mac's artwork resize, PlayQueue for the
  # repeat mode, and Common for the log and main-thread macros. Its sources
  # are Objective-C, so their MediaPlayer import links the framework. It lists
  # no sdk dependency, since XcodeGen refuses a target that lists the same
  # sdk twice, and an app lists MediaPlayer too. Its seam compiles in every
  # configuration and wraps its body in #if DEBUG.
  VibeLibsNowPlaying:
    templates: [VibeLibsCommon, VibeLibsGraphics, VibeLibsPlayQueue]
    sources:
      - path: system/NowPlaying
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/system/NowPlaying"]

  # macOS only, so no iOS target may list it. Its files sit in its Mac/ half,
  # as SettingsWindow's do. It lists Sparkle, which links and embeds the
  # framework. An app's configuration without the updater must exclude by
  # file name the framework and every source here that links Sparkle, in
  # EXCLUDED_SOURCE_FILE_NAMES. That is Sparkle.framework and VibeUpdater.m.
  # check-pieces fails when another source here reaches Sparkle, so the list
  # stays those two names.
  VibeLibsUpdates:
    templates: [VibeLibsSparkle]
    sources:
      - path: system/Updates
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/system/Updates/Mac"]

  # The debug command channel: the command-file drain, the lookup over an
  # app's command tables, and the wire format. It lists Common for the log
  # macros. An app compiles it into every configuration. Each source wraps
  # its body in #if DEBUG, so a release build ships none of it.
  VibeLibsDebugChannel:
    templates: [VibeLibsCommon]
    sources:
      - path: dev/DebugChannel
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/dev/DebugChannel"]

  # iOS only: the touch driver, a resident XCUITest. Only an iOS UI-testing
  # bundle lists it, and that bundle links XCTest itself. It has no headers,
  # so it searches nothing.
  VibeLibsIOSDriver:
    sources:
      - path: dev/iOSDriver
        excludes: ["**/*.md", "${excludedPlatform}/**"]

  # macOS only, so no iOS target may list it. Its files sit in its Mac/ half,
  # as SettingsWindow's do. It lists Common for the scheduler type. Its seams
  # compile in every configuration and wrap their bodies in #if DEBUG.
  VibeLibsAppOpening:
    templates: [VibeLibsCommon]
    sources:
      - path: system/AppOpening
        excludes: ["**/*.md", "${excludedPlatform}/**"]
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/system/AppOpening/Mac"]

  # ---- third_party/: other authors' code, one piece per library ----
  #
  # Each template carries the compiler flags its library builds with, so an
  # app needs none of its own. None of these sources is analyzed. The license,
  # privacy, and filter-table files stay out of an app's bundle. A template
  # whose headers an app spells with the library's directory, as <ogg/ogg.h>,
  # <PINCache/PINCache.h>, and "dr_flac/dr_flac.h" are, also searches
  # third_party/ itself.

  # A subset of TagLib 2.3.2. Its files include each other by name, so every
  # directory that holds its headers is searched. Its sources are C++17, so an
  # app builds C++ as C++17 or later.
  #
  # TRAP: an app that also takes VibeLibsVorbis lists it before this template
  # and before VibeLibsTags. taglib/ogg holds TagLib's own
  # vorbis/vorbisfile.h, and the first search path wins.
  VibeLibsTaglib:
    sources:
      - path: third_party/taglib
        excludes: ["**/*.md", "**/LICENSE.MPL"]
        compilerFlags: &third-party-flags
          - "-Xclang"
          - "-analyzer-disable-all-checks"
          - "-Wno-documentation-html"
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(VIBE_LIBS_ROOT)/third_party/taglib"
          - "$(VIBE_LIBS_ROOT)/third_party/taglib/toolkit"
          - "$(VIBE_LIBS_ROOT)/third_party/taglib/mpeg"
          - "$(VIBE_LIBS_ROOT)/third_party/taglib/mpeg/id3v1"
          - "$(VIBE_LIBS_ROOT)/third_party/taglib/mpeg/id3v2"
          - "$(VIBE_LIBS_ROOT)/third_party/taglib/mpeg/id3v2/frames"
          - "$(VIBE_LIBS_ROOT)/third_party/taglib/ape"
          - "$(VIBE_LIBS_ROOT)/third_party/taglib/mp4"
          - "$(VIBE_LIBS_ROOT)/third_party/taglib/flac"
          - "$(VIBE_LIBS_ROOT)/third_party/taglib/riff"
          - "$(VIBE_LIBS_ROOT)/third_party/taglib/riff/aiff"
          - "$(VIBE_LIBS_ROOT)/third_party/taglib/riff/wav"
          - "$(VIBE_LIBS_ROOT)/third_party/taglib/ogg"
          - "$(VIBE_LIBS_ROOT)/third_party/taglib/ogg/vorbis"
          - "$(VIBE_LIBS_ROOT)/third_party/taglib/ogg/opus"

  # PINDiskCache.m builds with ARC exceptions on, as the pod's
  # ARC-exception-safe subspec did.
  VibeLibsPINCache:
    templates: [VibeLibsPINOperation]
    sources:
      - path: third_party/PINCache
        excludes: ["**/*.md", "**/*.txt", "**/*.xcprivacy", "PINDiskCache.m"]
        compilerFlags: *third-party-flags
      - path: third_party/PINCache/PINDiskCache.m
        compilerFlags:
          - "-fobjc-arc-exceptions"
          - "-Xclang"
          - "-analyzer-disable-all-checks"
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(VIBE_LIBS_ROOT)/third_party"
          - "$(VIBE_LIBS_ROOT)/third_party/PINCache"

  VibeLibsPINOperation:
    sources:
      - path: third_party/PINOperation
        excludes: ["**/*.md", "**/*.txt", "**/*.xcprivacy"]
        compilerFlags: *third-party-flags
    settings:
      base:
        HEADER_SEARCH_PATHS:
          - "$(inherited)"
          - "$(VIBE_LIBS_ROOT)/third_party"
          - "$(VIBE_LIBS_ROOT)/third_party/PINOperation"

  # Header-only but for upstream's C entry points, DLL/r8bsrc.cpp, and its FFT.
  # Optimized in every configuration, since at -O0 it costs many times its
  # optimized self, and a Debug build is where an app's quality and cost tests
  # run. The empty R8BSRC_DECL is upstream's switch from a DLL to an object
  # file. R8B_PFFFT_DOUBLE is its README's speed setting.
  #
  # TRAP: PFFFT's NEON path is opt-in, and -w hides the message that says so.
  # Without PFFFT_ENABLE_NEON, arm64 builds its scalar fallback.
  VibeLibsR8brain:
    sources:
      - path: third_party/r8brain
        excludes: ["**/*.md", "**/*.txt", "**/*.inc"]
        compilerFlags:
          - "-O3"
          - "-DR8BSRC_DECL="
          - "-DR8B_PFFFT_DOUBLE=1"
          - "-DPFFFT_ENABLE_NEON=1"
          - "-w"
          - "-Xclang"
          - "-analyzer-disable-all-checks"
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/third_party"]

  # The dr_ decoders, each with fixes of Vibe's own. Optimized in every
  # configuration, as r8brain is, so a Debug build decodes as a shipped one does.
  VibeLibsDrMp3:
    sources:
      - path: third_party/dr_mp3
        excludes: ["**/*.md"]
        compilerFlags: &dr-libs-flags
          - "-O3"
          - "-w"
          - "-Xclang"
          - "-analyzer-disable-all-checks"
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/third_party"]

  VibeLibsDrFlac:
    sources:
      - path: third_party/dr_flac
        excludes: ["**/*.md"]
        compilerFlags: *dr-libs-flags
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/third_party"]

  VibeLibsDrWav:
    sources:
      - path: third_party/dr_wav
        excludes: ["**/*.md"]
        compilerFlags: *dr-libs-flags
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/third_party"]

  # libogg and libvorbis build as the dr_ decoders do. Only their C files join
  # an app's project.
  #
  # TRAP: none of their headers may join it. Xcode's headermap finds a header
  # by its name from any target, and libvorbis's vorbisfile.h would answer for
  # TagLib's.
  VibeLibsOgg:
    sources:
      - path: third_party/ogg
        includes: ["*.c"]
        compilerFlags: *dr-libs-flags
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/third_party"]

  VibeLibsVorbis:
    templates: [VibeLibsOgg]
    sources:
      - path: third_party/vorbis/lib
        includes: ["*.c"]
        compilerFlags: *dr-libs-flags
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(VIBE_LIBS_ROOT)/third_party/vorbis/include"]

  # Sparkle's prebuilt framework, macOS only. It compiles nothing. It links
  # the framework, embeds it in the product's Frameworks, and signs it there
  # with the target's own identity. Its tools in bin/ never join a project.
  VibeLibsSparkle:
    dependencies:
      - framework: third_party/Sparkle/Sparkle.framework
        embed: true
        codeSign: true
