name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The macOS jobs run side by side. The pieces job at the end keeps the check
# name branch protection asks for, and passes only when its jobs pass.
#
# On a pull request, make takes SINCE from here. The checkout is the merge
# commit, so its first parent is the base, and a depth of 2 reaches it.
env:
  SINCE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}

jobs:
  checks:
    runs-on: macos-26
    # Checks the piece rules, tests the strings tools, builds every piece for
    # iOS, and builds and runs the minimal consumer.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup-xcodegen

      - name: Check the piece rules
        run: make check-pieces

      - name: Test the strings tools
        run: make test-strings

      - name: Build every piece for iOS
        run: make build-ios

      - name: Build and run a minimal consumer
        run: make consumer

  test:
    runs-on: macos-26
    # Tests every piece on macOS. The limit grows with the piece count.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup-xcodegen

      - name: Test every piece on macOS
        id: test
        run: make test

      # make test passes -quiet, so the step above names a failing test and
      # nothing more. A failed xcodebuild also stops make before its summary.
      - name: Print the failing tests' messages
        if: failure() && steps.test.outcome == 'failure'
        run: python3 -I scripts/checks/test-summary.py build/TestResults.xcresult

      - name: Upload the result bundle
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: TestResults.xcresult
          path: build/TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore

  pieces:
    if: always()
    needs: [checks, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pass only when the checks and the tests pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
